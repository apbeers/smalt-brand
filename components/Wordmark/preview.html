<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark — Grain mark + Martian Mono wordmark</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
</head>
<body>
<div class="row">
  <span class="lockup">
    <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="smaltdb"><path class="body" d="M14 18h18v10h14v24a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6z"/><rect class="chip" x="38" y="8" width="16" height="16" rx="3"/></svg>
    <span class="word">sm<span class="alt">alt</span>db</span>
  </span>
  <span class="tag">Small. Alternative. Fast.</span>
</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Martian+Mono:wght@600&family=Geist:wght@400&display=swap');
body { margin: 0; background: var(--bg); }
.row { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-6); }
.lockup { display: inline-flex; align-items: center; gap: var(--space-4); }
.mark { width: 56px; height: 56px; }
.mark .body { fill: var(--primary); }
.mark .chip { fill: var(--smalt-300); }
[data-theme="dark"] .mark .chip { fill: var(--smalt-100); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark .chip { fill: var(--smalt-100); } }
.word { font: 600 44px/1 var(--font-brand); letter-spacing: -0.06em; color: var(--text); }
.alt { color: var(--primary); }
.tag { font: 400 14px/1.5 var(--font-sans); color: var(--text-3); padding-left: 72px; }
</style>
</body>
</html>
