<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusBadge — Committed, stale, failed — icon + word</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
</head>
<body>
<div class="row">
  <!-- Icons in the Chevron style (BRAND.md, Iconography): solid bars with square-cut ends at 45° and 90°, one rounded chip at most. -->
  <span class="badge ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13L5.5 10.5L9.5 14.5L18.5 5.5L21 8L9.5 19.5Z"/></svg>Committed</span>
  <span class="badge warn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.25 3.5h3.5v11h-3.5z"/><path d="M11.35 17h1.3a1.1 1.1 0 0 1 1.1 1.1v1.3a1.1 1.1 0 0 1 -1.1 1.1h-1.3a1.1 1.1 0 0 1 -1.1 -1.1v-1.3a1.1 1.1 0 0 1 1.1 -1.1z"/></svg>Stale</span>
  <span class="badge bad"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7L7 4.5L12 9.5L17 4.5L19.5 7L14.5 12L19.5 17L17 19.5L12 14.5L7 19.5L4.5 17L9.5 12Z"/></svg>Failed</span>
</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap');
body { margin: 0; background: var(--bg); }
.row { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-6); flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); font: 500 14px/1 var(--font-sans); }
.badge svg { width: 16px; height: 16px; fill: currentColor; }
.ok { color: var(--success); }
.warn { color: var(--warning); }
.bad { color: var(--danger); }
</style>
</body>
</html>
